<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvalRouter report</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 48rem; }
    h1 { font-size: 1.25rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    .pass { color: #0a0; }
    .fail { color: #a00; }
    .meta { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Eval run report</h1>
  <p class="meta" id="summary">Loading…</p>
  <table>
    <thead>
      <tr><th>Eval</th><th>Result</th><th>Reason</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const params = new URLSearchParams(location.search);
    const runId = params.get("run_id");
    const summary = document.getElementById("summary");
    const rows = document.getElementById("rows");
    if (!runId) {
      summary.textContent = "Missing run_id query parameter.";
    } else {
      summary.textContent = "Run " + runId + " — open from get_eval_report report_url with project auth on the API.";
      fetch("/v1/tools/get_eval_report", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (window.__EVALROUTER_KEY || "") },
        body: JSON.stringify({ project_id: window.__EVALROUTER_PROJECT || "", run_id: runId })
      }).then(r => r.json()).then(data => {
        if (data.summary) {
          summary.textContent = "Run " + data.summary.run_id + " — pass " + data.summary.n_pass + ", fail " + data.summary.n_fail + ", cost $" + data.summary.cost_usd.toFixed(4);
          rows.innerHTML = "";
          for (const item of data.items || []) {
            const tr = document.createElement("tr");
            tr.innerHTML = "<td>" + item.title + "</td><td class='" + (item.passed ? "pass" : "fail") + "'>" + (item.passed ? "pass" : "fail") + "</td><td>" + item.reason_short + "</td>";
            rows.appendChild(tr);
          }
        }
      }).catch(() => {
        summary.textContent = "Run " + runId + " — use get_eval_report for details.";
      });
    }
  </script>
</body>
</html>
