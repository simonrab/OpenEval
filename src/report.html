<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvalRouter report</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 48rem; }
    h1 { font-size: 1.25rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    .pass { color: #0a0; }
    .fail { color: #a00; }
    .meta { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Eval run report</h1>
  <p class="meta">{{SUMMARY}}</p>
  <h2>Models</h2>
  <table>
    <thead>
      <tr><th>Model</th><th>Pass</th><th>Fail</th><th>Failing evals</th></tr>
    </thead>
    <tbody>{{MODEL_ROWS}}</tbody>
  </table>
  <h2>Evals</h2>
  <table>
    <thead>
      <tr><th>Eval</th><th>Result</th><th>Reason</th></tr>
    </thead>
    <tbody>{{EVAL_ROWS}}</tbody>
  </table>
</body>
</html>
