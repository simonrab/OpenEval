<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{HEADING}}</title>
  <style>
    body { font-family: sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; color: #111; }
    h1 { font-size: 1.35rem; margin-bottom: 0.5rem; }
    .lede { margin: 0.4rem 0 1rem; }
    .key { display: flex; gap: 0.75rem; margin: 0 0 1.25rem; }
    .key span { font-size: 0.85rem; padding: 0.2rem 0.5rem; border-radius: 0.2rem; }
    .badge { display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 0.2rem; }
    .badge-a { background: #111; color: #fff; }
    .badge-b { background: #ddd; color: #111; }
    ul { list-style: none; padding: 0; margin: 0; }
    li.card { border: 1px solid #ddd; padding: 0.9rem 1rem; margin: 0 0 0.75rem; }
    li.card p { margin: 0.4rem 0 0; }
    .claim { font-size: 1.05rem; }
    .quote { color: #444; font-size: 0.95rem; }
    .choices { margin-top: 0.7rem; display: flex; gap: 1rem; }
    .foot { color: #666; font-size: 0.8rem; margin-top: 1.5rem; }
    button { margin: 0.5rem 0 1rem; padding: 0.45rem 0.9rem; }
  </style>
</head>
<body>
  <h1>{{HEADING}}</h1>
  <p class="lede">{{JOB_DESCRIPTION}}</p>
  {{KEY}}
  <p>{{HINT}}</p>
  {{BANNER}}
  <form method="post" action="/accept">
    <input type="hidden" name="eval_set_id" value="{{EVAL_SET_ID}}">
    <input type="hidden" name="token" value="{{TOKEN}}">
    <ul>
      {{EVAL_ROWS}}
    </ul>
    <button type="submit">{{BUTTON}}</button>
  </form>
  <p class="foot">{{FOOT}}</p>
</body>
</html>
