<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accept draft evals</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    li { margin: 1rem 0; list-style: none; border-bottom: 1px solid #ddd; padding-bottom: 0.75rem; }
    .meta { color: #444; font-size: 0.9rem; }
    button { margin-top: 1rem; padding: 0.4rem 0.8rem; }
  </style>
</head>
<body>
  <h1>Draft evals</h1>
  <p>Eval set {{EVAL_SET_ID}} · version {{VERSION}}</p>
  <p>Accept code evals to trust them. Rejected drafts are dropped from this set. No model is run here.</p>
  {{BANNER}}
  <form method="post" action="/accept">
    <input type="hidden" name="eval_set_id" value="{{EVAL_SET_ID}}">
    <input type="hidden" name="token" value="{{TOKEN}}">
    <ul>
      {{EVAL_ROWS}}
    </ul>
    <button type="submit">Save decisions</button>
  </form>
</body>
</html>
